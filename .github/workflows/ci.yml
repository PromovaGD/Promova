name: Pipeline

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  frontend-build-application:
    name: Frontend Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and build
        run: npm run check

  backend-build-application:
    name: Backend Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Prepare Gradle wrapper
        working-directory: backend
        run: chmod +x gradlew

      - name: Run migration and startup smoke test
        working-directory: backend
        run: ./gradlew migrationStartupSmoke --no-daemon --no-configuration-cache --stacktrace

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon --no-configuration-cache --stacktrace

      - name: Build service jar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon --no-configuration-cache --stacktrace

  authentication-browser-regression:
    name: Authentication Browser Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install frontend dependencies
        run: npm ci

      - name: Run session reload E2E test
        env:
          PROMOVA_E2E_CHROME: /usr/bin/google-chrome
        run: npm run test:e2e

  application-runtime-smoke:
    name: Application Runtime Smoke
    runs-on: ubuntu-latest
    needs:
      - frontend-build-application
      - backend-build-application

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare smoke scripts
        run: chmod +x backend/gradlew scripts/ci-smoke.sh

      - name: Build and run application smoke test
        run: npm run smoke:ci

      - name: Upload sanitized smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-smoke-logs
          path: artifacts/smoke
          if-no-files-found: error
          retention-days: 7
