<!doctype html>

    <title>Promova front-end screenshot archive</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 48px; background: #f5f3ff; color: #11153f; font: 16px/1.4 Arial, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 36px; }
      p { margin: 0 0 32px; color: #626681; }
      main { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }

      figcaption { min-height: 72px; padding: 14px 16px; font-weight: 700; }
      small { display: block; margin-top: 4px; color: #7a7e98; font-weight: 400; }
