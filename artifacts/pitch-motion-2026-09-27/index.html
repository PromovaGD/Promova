<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Promova — demonstração do produto</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% -15%, #352081 0, #15143b 45%, #0b0d25 85%); color: #f8f7ff; }
      main { width: min(100%, 1660px); padding: clamp(12px, 3vw, 40px); }
      .heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
      h1 { margin: 0; font-size: clamp(19px, 2.5vw, 30px); letter-spacing: -.035em; }
      p { margin: 6px 0 0; color: #c5c4e6; font-size: 14px; }
      a { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border: 1px solid #8576d1; border-radius: 10px; color: #fff; text-decoration: none; white-space: nowrap; font-weight: 650; background: #352478; }
      a:hover, a:focus-visible { background: #5135ab; }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; background: #10142c; box-shadow: 0 28px 90px #0009; }
      .note { margin-top: 14px; font-size: 13px; }
      @media (max-width: 650px) { .heading { align-items: start; flex-direction: column; } video { border-radius: 8px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="heading">
        <div>
          <h1>Promova em ação</h1>
          <p>Uma demonstração contínua das principais funcionalidades para o pitch.</p>
        </div>
        <a href="promova-demo-produto-30s.mp4" download>Baixar MP4</a>
      </div>
      <video controls autoplay muted playsinline loop preload="metadata" aria-label="Demonstração do aplicativo Promova">
        <source src="promova-demo-produto-30s.mp4" type="video/mp4" />
        Seu navegador não conseguiu reproduzir o vídeo. Use o botão Baixar MP4.
      </video>
      <p class="note">30 segundos · 16:9 · sem áudio. Use o MP4 diretamente no slide.</p>
    </main>
  </body>
</html>
