# Runtime smoke profile: disposable database, deterministic local-only integrations.
spring.datasource.url=jdbc:h2:mem:promova-ci;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
spring.h2.console.enabled=false
promova.cors.allowed-origins=${PROMOVA_CORS_ALLOWED_ORIGINS:http://127.0.0.1:14173}
promova.analysis.engine=mock
github.api.base-url=http://127.0.0.1:9
github.api.token=
openrouter.api-key=
