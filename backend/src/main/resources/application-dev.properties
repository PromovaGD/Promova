spring.datasource.url=${PROMOVA_DEV_DB_URL:jdbc:h2:file:./data/promova;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# The current prototype database was created by Hibernate before Flyway was introduced.
# Baseline it at the Task 7 schema version without deleting or rewriting its data.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=Task 7 prototype schema
promova.cors.allowed-origins=${PROMOVA_CORS_ALLOWED_ORIGINS:http://localhost:*}
