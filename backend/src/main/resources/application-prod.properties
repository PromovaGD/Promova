spring.datasource.url=${PROMOVA_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PROMOVA_DB_USERNAME}
spring.datasource.password=${PROMOVA_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
spring.h2.console.enabled=false

# Production must declare the browser origins explicitly; there is no localhost fallback.
promova.cors.allowed-origins=${PROMOVA_CORS_ALLOWED_ORIGINS}
